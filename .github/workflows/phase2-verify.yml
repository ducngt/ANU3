name: ANU P2-T02 + P3 Contract Foundation Verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: anu-p2t02-p3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test:
    name: P2-T02/P3 contracts, migration, replay and conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate ANU project
        shell: bash
        run: |
          if [ -f pyproject.toml ]; then
            echo "ANU_PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f anu-phase1-kernel/pyproject.toml ]; then
            echo "ANU_PROJECT_DIR=anu-phase1-kernel" >> "$GITHUB_ENV"
          else
            echo "ANU pyproject.toml not found" >&2
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install verification dependencies
        shell: bash
        run: cd "$ANU_PROJECT_DIR" && python -m pip install -e '.[test]'
      - name: Run complete local verifier
        shell: bash
        run: cd "$ANU_PROJECT_DIR" && python scripts/verify_p2t02_p3.py
      - name: Upload local evidence
        uses: actions/upload-artifact@v4
        with:
          name: p2t02-p3-local-verification-evidence
          path: |
            ${{ env.ANU_PROJECT_DIR }}/docs/verification/P2T02-P3-LATEST.json
            ${{ env.ANU_PROJECT_DIR }}/docs/verification/TECHNICAL-DETAILS-P2T02-P3.json
          if-no-files-found: error

  postgres-live:
    name: PostgreSQL 16 multimodal/recovery proof
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: anu_p2t02
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d anu_p2t02"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ANU_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/anu_p2t02
      ANU_POSTGRES_RESTORE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/anu_p2t02_restore
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Locate ANU project
        shell: bash
        run: |
          if [ -f pyproject.toml ]; then
            echo "ANU_PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f anu-phase1-kernel/pyproject.toml ]; then
            echo "ANU_PROJECT_DIR=anu-phase1-kernel" >> "$GITHUB_ENV"
          else
            echo "ANU pyproject.toml not found" >&2
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project and PostgreSQL driver
        shell: bash
        run: cd "$ANU_PROJECT_DIR" && python -m pip install -e '.[test,postgres]'
      - name: Install PostgreSQL client tools
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Clean live migration to revision 0004
        shell: bash
        run: cd "$ANU_PROJECT_DIR" && alembic upgrade head
      - name: Assert live Alembic head
        shell: bash
        run: cd "$ANU_PROJECT_DIR" && test "$(alembic current | awk '{print $1}')" = "0004"
      - name: Create isolated restore database
        shell: bash
        run: createdb -h localhost -U postgres anu_p2t02_restore
      - name: Run live ARU-01 multimodal pilot and DB/object-store recovery
        shell: bash
        run: |
          cd "$ANU_PROJECT_DIR"
          rm -rf /tmp/anu-p2t02-objects /tmp/anu-p2t02-restored-objects
          python scripts/postgres_p2t02_p3_live_verify.py \
            --database-url "$ANU_DATABASE_URL" \
            --restore-url "$ANU_POSTGRES_RESTORE_URL" \
            --backup /tmp/anu-p2t02-postgres.dump \
            --object-store /tmp/anu-p2t02-objects \
            --restored-object-store /tmp/anu-p2t02-restored-objects \
            --output docs/verification/POSTGRES-P2T02-P3-LIVE.json
      - name: Upload PostgreSQL live evidence
        uses: actions/upload-artifact@v4
        with:
          name: p2t02-p3-postgresql-live-evidence
          path: ${{ env.ANU_PROJECT_DIR }}/docs/verification/POSTGRES-P2T02-P3-LIVE.json
          if-no-files-found: error

  independent-verify:
    name: Independent P2-T02/P3 evidence qualification
    needs: [build-test, postgres-live]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate ANU project
        shell: bash
        run: |
          if [ -f pyproject.toml ]; then
            echo "ANU_PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f anu-phase1-kernel/pyproject.toml ]; then
            echo "ANU_PROJECT_DIR=anu-phase1-kernel" >> "$GITHUB_ENV"
          else
            echo "ANU pyproject.toml not found" >&2
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install independent verifier dependencies
        shell: bash
        run: cd "$ANU_PROJECT_DIR" && python -m pip install -e '.[test]'
      - name: Download live PostgreSQL evidence
        uses: actions/download-artifact@v4
        with:
          name: p2t02-p3-postgresql-live-evidence
          path: ${{ env.ANU_PROJECT_DIR }}/docs/verification/
      - name: Run independent architecture/trust boundary tests
        shell: bash
        run: cd "$ANU_PROJECT_DIR" && python -m pytest tests/independent/test_p2t02_p3_boundaries.py -q
      - name: Independently qualify PostgreSQL evidence
        shell: bash
        run: |
          cd "$ANU_PROJECT_DIR"
          python scripts/verify_p2t02_p3_postgres_evidence.py \
            --input docs/verification/POSTGRES-P2T02-P3-LIVE.json \
            --output docs/verification/POSTGRES-P2T02-P3-LIVE-QUALIFIED.json
      - name: Publish Human-readable CI summary
        shell: bash
        run: |
          echo "## ANU P2-T02 + P3 Contract Foundation Evidence" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Revision 0004 clean migration on PostgreSQL 16: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Multimodal PDF/DOCX/image/audio/video artifact ingestion: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact integrity and provenance chain: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Knowledge materialization preserves epistemic type: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- University Memory + retrieval with source/provenance: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Capability Registry + Smart Box discovery/provider replaceability: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- PostgreSQL + object-store recovery: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Independent evidence qualification: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Technical evidence is complete. Human G3 remains a separate outcome/responsibility decision." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload qualified release evidence
        uses: actions/upload-artifact@v4
        with:
          name: p2t02-p3-qualified-release-evidence
          path: |
            ${{ env.ANU_PROJECT_DIR }}/docs/verification/POSTGRES-P2T02-P3-LIVE.json
            ${{ env.ANU_PROJECT_DIR }}/docs/verification/POSTGRES-P2T02-P3-LIVE-QUALIFIED.json
          if-no-files-found: error

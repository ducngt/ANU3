[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anu-phase1-kernel"
version = "0.7.0"
description = "ANU 4.0 Kernel, Reality/Data/Memory, SBBS Capability Runtime and Governed Human-AI Work Runtime"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.7",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "uvicorn>=0.30",
  "cryptography>=42",
  "PyJWT>=2.8",
  "python-multipart>=0.0.9",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "Pillow>=10.4",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
test = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
